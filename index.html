<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolePosition — Monaco</title>
  <link rel="stylesheet" href="./css/style.css">

  <!--
    Module resolution for the no-build-step setup.
    Pulled from jsdelivr (faster + more reliable than esm.sh for WASM-bundled
    packages — esm.sh transforms on demand, jsdelivr serves as-is).
    rapier3d-compat ships its WASM inline, so no separate .wasm fetch is needed.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="speed-row">
      <span id="speed">0</span><span class="unit" id="speed-unit">km/h</span>
    </div>
    <div id="hud-meta">
      <div><span class="label">Gear</span> <span id="gear">—</span></div>
      <div><span class="label">FPS</span> <span id="fps">0</span></div>
      <div><span class="label">Slip</span> <span id="slip">0°</span></div>
    </div>
    <div id="hud-input">
      <span class="label">Input</span>
      <span class="key" id="key-w">W</span>
      <span class="key" id="key-a">A</span>
      <span class="key" id="key-s">S</span>
      <span class="key" id="key-d">D</span>
      <span class="steer">steer: <span id="steer-val">0.00</span></span>
    </div>
    <div id="hud-help">
      WASD / Arrows · R reset · Phase 2 — Monaco
    </div>
  </div>

  <!-- Top-right: lap timing readouts -->
  <div id="hud-timing">
    <div id="lap-timer">0:00.000</div>
    <div id="sectors">
      <div class="sector" id="sector-1"><span class="label">S1</span> <span class="time">—</span></div>
      <div class="sector" id="sector-2"><span class="label">S2</span> <span class="time">—</span></div>
      <div class="sector" id="sector-3"><span class="label">S3</span> <span class="time">—</span></div>
    </div>
    <div id="lap-summary">
      <div><span class="label">Last</span> <span id="last-lap">—:—.—</span></div>
      <div><span class="label">Best</span> <span id="best-lap">—:—.—</span></div>
      <div><span class="label">Lap</span>  <span id="lap-count">0</span></div>
    </div>
    <div id="race-event">&nbsp;</div>
  </div>

  <div id="loading">
    <div>Loading PolePosition…</div>
    <div id="loading-detail">initialising physics</div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
